<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root {
    --bg: #fff8f5;
    --surface: #ffffff;
    --text: #1f1a1c;
    --muted: #6b5f63;
    --accent: #ef4b4b;
    --accent-2: #ff7a45;
    --border: #f1e3de;
    --shadow: 0 10px 30px rgba(232, 52, 78, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161214;
      --surface: #211b1e;
      --text: #f5eef0;
      --muted: #b4a6ab;
      --border: #33292d;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  header { display: flex; align-items: center; gap: 10px; padding: 20px 0; font-weight: 700; }
  header img { width: 32px; height: 32px; }
  .hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; align-items: center; padding: 48px 0 64px; }
  h1 { font-size: clamp(36px, 6vw, 56px); line-height: 1.15; margin: 0 0 16px; letter-spacing: -.5px; }
  h1 span { background: linear-gradient(135deg, var(--accent-2), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lead { color: var(--muted); font-size: 18px; margin: 0 0 28px; }
  .buttons { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 20px; border-radius: 12px; font-weight: 600; text-decoration: none;
    border: 1px solid var(--border); color: var(--text); background: var(--surface);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .btn.primary { background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: #fff; border-color: transparent; }
  .btn svg { width: 18px; height: 18px; fill: currentColor; }
  .art { display: flex; justify-content: center; }
  .art img { width: min(320px, 70vw); filter: drop-shadow(0 24px 48px rgba(232, 52, 78, .35)); }
  .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding-bottom: 64px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; }
  .card h3 { margin: 0 0 6px; font-size: 17px; }
  .card p { margin: 0; color: var(--muted); font-size: 15px; }
  footer { border-top: 1px solid var(--border); padding: 24px 0 40px; color: var(--muted); font-size: 14px; }
  footer a { color: inherit; }
  @media (max-width: 760px) {
    .hero { grid-template-columns: 1fr; text-align: center; padding-top: 24px; }
    .art { order: -1; }
    .art img { width: 180px; }
    .buttons { justify-content: center; }
    .features { grid-template-columns: 1fr; }
  }
</style>
</head>

</html>
